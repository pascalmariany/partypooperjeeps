# nginx-vhost voor partypooperjeeps.eu (Contabo, statische site uit /var/www/partypooperjeeps.eu/current).
#
# Installeren:  cp deploy/nginx-partypooperjeeps.eu-locaties.conf /etc/nginx/snippets/partypooperjeeps.eu-locaties.conf
#               cp deploy/nginx-partypooperjeeps.eu.conf /etc/nginx/sites-available/partypooperjeeps.eu
#               ln -s /etc/nginx/sites-available/partypooperjeeps.eu /etc/nginx/sites-enabled/
#               nginx -t && systemctl reload nginx
#
# Certificaten:
#   partypooperjeeps.eu + www                 webroot /var/www/partypooperjeeps.eu/acme (DNS-zone in DirectAdmin vserver84, user pascalmariany)

server {
    listen 80;
    listen [::]:80;
    server_name partypooperjeeps.eu www.partypooperjeeps.eu;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/partypooperjeeps.eu/acme;
        default_type text/plain;
    }
    location / { return 301 https://$host$request_uri; }
}

# www -> zonder www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.partypooperjeeps.eu;
    ssl_certificate /etc/letsencrypt/live/partypooperjeeps.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partypooperjeeps.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    return 301 https://partypooperjeeps.eu$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name partypooperjeeps.eu;
    ssl_certificate /etc/letsencrypt/live/partypooperjeeps.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partypooperjeeps.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    # HSTS van een jaar, zoals de andere sites
    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/partypooperjeeps.eu-locaties.conf;
}
