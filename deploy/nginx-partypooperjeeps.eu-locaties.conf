# HSTS staat per location: nginx negeert add_header van het serverblok zodra een location eigen headers heeft.
# Gedeeld door live en preview (zie nginx-partypooperjeeps.eu.conf).
root /var/www/partypooperjeeps.eu/current;
index index.html;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# Highscore-API (Docker, alleen via localhost; zie highscores/)
location /api/ {
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8099;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
}
location / {
    # SPA-routes (indien aanwezig) vallen terug op index.html, net als op Netlify
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    try_files $uri /index.html;
}
